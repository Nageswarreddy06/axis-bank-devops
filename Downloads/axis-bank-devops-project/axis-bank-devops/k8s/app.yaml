apiVersion: apps/v1
kind: Deployment
metadata:
  name: axis-bank-app
  namespace: axis-bank
  labels:
    app: axis-bank-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: axis-bank-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: axis-bank-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: axis-bank-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: axis-bank-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql+psycopg://axisbank:$(POSTGRES_PASSWORD)@postgres:5432/axisbank"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: axis-bank-secrets
                  key: jwt-secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: axis-bank-app
  namespace: axis-bank
spec:
  type: ClusterIP
  selector:
    app: axis-bank-app
  ports:
    - name: http
      port: 80
      targetPort: 5000
