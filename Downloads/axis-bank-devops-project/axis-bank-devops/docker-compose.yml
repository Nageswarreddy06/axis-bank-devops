services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axisbank}
      POSTGRES_USER: ${POSTGRES_USER:-axisbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axisbank} -d ${POSTGRES_DB:-axisbank}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axisbank}:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/${POSTGRES_DB:-axisbank}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-secret-change-me}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
